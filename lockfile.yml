# Tools Fedora does not ship. A profile names the key under binaries.
# Each run downloads the channel URL and installs the result into ~/.local/bin.
# There is no pinned version or checksum.
#
# The URL itself is the executable:
#
#   example:
#     kind: file
#     url: "https://example.com/example-linux-amd64"
#     dest_name: example
#
# The URL is a tarball or zip. source_path installs one file.
# files installs several members from that same download:
#
#   example:
#     kind: archive
#     url: "https://example.com/example.tar.gz"
#     files:
#       - source_path: example
#         dest_name: example
binaries:
  oc:
    kind: archive
    url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
    files:
      - source_path: oc
        dest_name: oc
      - source_path: kubectl
        dest_name: kubectl

# Signed add-ons from addons.mozilla.org. A profile names the key under
# firefox_extensions. Only Mozilla Recommended or By Firefox add-ons belong
# here. Each run downloads the current xpi and replaces the copy in the profile
# when it differs.
firefox_extensions:
  multi-account-containers:
    id: "@testpilot-containers"
    url: "https://addons.mozilla.org/firefox/downloads/latest/multi-account-containers/latest.xpi"
  ublock-origin:
    id: "uBlock0@raymondhill.net"
    url: "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
  user-agent-switcher:
    id: "{a6c4a591-f1b2-4f03-b3ff-767e5bedf4e7}"
    url: "https://addons.mozilla.org/firefox/downloads/latest/user-agent-string-switcher/latest.xpi"
