    version: "2026.9.27"
    url: "https://addons.mozilla.org/firefox/downloads/file/5063818/imagus_reborn-2026.9.27.xpi"
    sha256: "a04e515b170a877ef5536715789296ff80fab0382270f82d9ddada9b9db2bb68"
  multi-account-containers:
    id: "@testpilot-containers"
    version: "8.3.8"
    url: "https://addons.mozilla.org/firefox/downloads/file/4867303/multi_account_containers-8.3.8.xpi"
    sha256: "306a294845363f15a7478e9620b43f91ea1761088727808e2327bfff16c14447"
  ublock-origin:
