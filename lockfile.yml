    version: "1.75.0"
    url: "https://addons.mozilla.org/firefox/downloads/file/5034826/ublock_origin-1.75.0.xpi"
    sha256: "5b74415860456370644bd80f16125e865b0e6c356bb5dfcfb84069967eaa5287"
  user-agent-switcher:
    id: "{a6c4a591-f1b2-4f03-b3ff-767e5bedf4e7}"
    version: "0.7.2"
